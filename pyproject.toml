[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retainkit"
version = "0.1.0"
description = "Context and memory policies for LLM agents, scored by the evidence that survives the token budget"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hadi Mohammadi" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "agents",
    "context-management",
    "long-term-memory",
    "retrieval",
    "llm-evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/mohammadi-hadi/retainkit"
Issues = "https://github.com/mohammadi-hadi/retainkit/issues"

[project.scripts]
retainkit = "retainkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]
viz = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/retainkit"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
